name: Build & publish golden AMI

# Builds ONLY on a release tag (v*). Each run launches a builder EC2 instance and
# creates a PUBLIC AMI in the configured AWS account, then uploads the manifest to
# academy. It never runs on branch pushes or pull requests — a bake is always a
# deliberate tagged release. The image version is taken from the tag (v1.2.3 → 1.2.3).
on:
  push:
    tags:
      - "v*"

# Required repo secrets:
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY — creds for the publishing AWS account
#     (493255580566). The mc-sandbox-ci IAM user with the Packer inline policy.
#   ACADEMY_MANIFEST_TOKEN — Bearer token matching academy's GOLDEN_AMI_MANIFEST_PUBLISH_TOKEN.
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - uses: hashicorp/setup-packer@main
        with:
          version: latest

      - name: Build AMI and publish manifest
        env:
          ACADEMY_MANIFEST_TOKEN: ${{ secrets.ACADEMY_MANIFEST_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Building golden AMI version $VERSION (tag $GITHUB_REF_NAME)"
          node scripts/build-ami.mjs \
            --version "$VERSION" \
            --regions "us-east-1" \
            --arch "x86_64" \
            --upload-url "https://agentsystem.dev/api/golden-ami/manifest"

      - uses: actions/upload-artifact@v4
        with:
          name: golden-ami-manifest
          path: dist/golden-ami-manifest.json
          if-no-files-found: error
